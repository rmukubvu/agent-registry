quarkus.http.port=8082

# ── CORS (allow the portal) ───────────────────────────────────────────────────
quarkus.http.cors=true
quarkus.http.cors.origins=${CORS_ALLOWED_ORIGINS:http://localhost:3002}

# ── DNA Registry URL ──────────────────────────────────────────────────────────
agentdna.registry.url=${REGISTRY_URL:http://localhost:8081}

# ── Jackson ───────────────────────────────────────────────────────────────────
quarkus.jackson.write-dates-as-timestamps=false
quarkus.jackson.serialization-inclusion=non_null

# ── Logging ───────────────────────────────────────────────────────────────────
quarkus.log.level=INFO
quarkus.log.category."com.agentdna".level=DEBUG
