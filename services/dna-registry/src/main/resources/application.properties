quarkus.http.port=${PORT:8081}

# ── CORS (allow the portal and enforcer) ─────────────────────────────────────
quarkus.http.cors=true
quarkus.http.cors.origins=${CORS_ALLOWED_ORIGINS:http://localhost:3002,http://localhost:8082}

# ── Datasource (Dev Services — Postgres auto-started by Quarkus in dev) ───────
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.additional-jdbc-properties.currentSchema=agent_dna

# ── Datasource (Production — supports explicit JDBC vars or Railway PG vars) ──
%prod.quarkus.datasource.jdbc.url=${JDBC_DATABASE_URL:jdbc:postgresql://${PGHOST}:${PGPORT:5432}/${PGDATABASE}}
%prod.quarkus.datasource.username=${JDBC_DATABASE_USERNAME:${PGUSER}}
%prod.quarkus.datasource.password=${JDBC_DATABASE_PASSWORD:${PGPASSWORD}}

# ── Flyway ────────────────────────────────────────────────────────────────────
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.default-schema=agent_dna

# ── Jackson ───────────────────────────────────────────────────────────────────
quarkus.jackson.write-dates-as-timestamps=false
quarkus.jackson.serialization-inclusion=non_null

# ── Logging ───────────────────────────────────────────────────────────────────
quarkus.log.level=INFO
quarkus.log.category."com.agentdna".level=DEBUG
