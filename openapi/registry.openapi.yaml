openapi: 3.1.0
info:
  title: Agent DNA Registry API
  version: 1.0.0
  summary: Agent identity issuance, lifecycle, and verification API.
  description: >
    The Agent DNA Registry is the system of record for agent identities. Clients use
    this API to register agents, approve or revoke them, inspect lifecycle state, and
    verify whether a given DNA record is currently authorized.
servers:
  - url: https://registry-production-0f52.up.railway.app
    description: Production
  - url: http://localhost:8081
    description: Local development
tags:
  - name: Agents
    description: Agent identity and lifecycle operations.
paths:
  /q/health/ready:
    get:
      operationId: getRegistryReadiness
      summary: Readiness health check
      tags: [Agents]
      responses:
        '200':
          description: Registry is ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /v1/agents:
    get:
      operationId: listAgents
      summary: List all agent records
      tags: [Agents]
      responses:
        '200':
          description: Agent records ordered by creation time descending.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AgentRecord'
    post:
      operationId: registerAgent
      summary: Register a new agent
      tags: [Agents]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterAgentRequest'
      responses:
        '201':
          description: Agent registered in PENDING status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterAgentResponse'
        '400':
          description: Invalid request payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Registration rejected by issuance policy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/agents/{dnaId}/activate:
    put:
      operationId: activateAgent
      summary: Approve and activate an agent
      description: >
        Moves an agent from PENDING to ACTIVE. Governance approval metadata is required.
        The API also accepts these values as query parameters for compatibility, but SDKs
        should send them in the JSON request body.
      tags: [Agents]
      parameters:
        - $ref: '#/components/parameters/DnaId'
        - name: idemKey
          in: query
          required: false
          schema:
            type: string
        - name: approvedBy
          in: query
          required: false
          schema:
            type: string
        - name: approvalReason
          in: query
          required: false
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivateAgentRequest'
      responses:
        '200':
          description: Agent activated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentTransitionResponse'
        '400':
          description: Missing governance approval metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Agent record not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid lifecycle transition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/agents/{dnaId}/suspend:
    put:
      operationId: suspendAgent
      summary: Suspend an active agent
      tags: [Agents]
      parameters:
        - $ref: '#/components/parameters/DnaId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuspendAgentRequest'
      responses:
        '200':
          description: Agent suspended successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentTransitionResponse'
        '404':
          description: Agent record not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid lifecycle transition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/agents/{dnaId}/reinstate:
    put:
      operationId: reinstateAgent
      summary: Reinstate a suspended agent
      tags: [Agents]
      parameters:
        - $ref: '#/components/parameters/DnaId'
        - name: idemKey
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Agent reinstated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentTransitionResponse'
        '404':
          description: Agent record not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid lifecycle transition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/agents/{dnaId}/revoke:
    put:
      operationId: revokeAgent
      summary: Revoke an agent permanently
      tags: [Agents]
      parameters:
        - $ref: '#/components/parameters/DnaId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevokeAgentRequest'
      responses:
        '200':
          description: Agent revoked successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentTransitionResponse'
        '404':
          description: Agent record not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid lifecycle transition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/agents/{dnaId}/verify:
    get:
      operationId: verifyAgent
      summary: Verify whether an agent is currently authorized
      tags: [Agents]
      parameters:
        - $ref: '#/components/parameters/DnaId'
      responses:
        '200':
          description: Verification result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyAgentResponse'
        '404':
          description: Agent record not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  parameters:
    DnaId:
      name: dnaId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Unique DNA identifier for the agent.
  schemas:
    AgentStatus:
      type: string
      enum:
        - PENDING
        - ACTIVE
        - SUSPENDED
        - REVOKED
    RegisterAgentRequest:
      type: object
      additionalProperties: false
      required:
        - agentName
        - publicKeyHex
        - ownerId
        - ownerName
        - jurisdiction
        - capabilities
        - idemKey
      properties:
        agentName:
          type: string
        publicKeyHex:
          type: string
          description: Hex-encoded Ed25519 public key.
        workloadIdentity:
          type:
            - string
            - 'null'
          description: Optional workload or service-principal identity.
        provenanceRef:
          type:
            - string
            - 'null'
          description: Optional build, release, or provenance reference.
        ownerId:
          type: string
          format: uuid
        ownerName:
          type: string
        jurisdiction:
          type: string
        capabilities:
          type: array
          items:
            type: string
        parentDnaId:
          type:
            - string
            - 'null'
          format: uuid
          description: Parent manager DNA ID for worker agents.
        expiresAt:
          type:
            - string
            - 'null'
          format: date-time
          description: Optional expiry for ephemeral agents.
        idemKey:
          type: string
    RegisterAgentResponse:
      type: object
      additionalProperties: false
      required:
        - dnaId
        - agentName
        - status
      properties:
        dnaId:
          type: string
          format: uuid
        agentName:
          type: string
        status:
          $ref: '#/components/schemas/AgentStatus'
    ActivateAgentRequest:
      type: object
      additionalProperties: false
      required:
        - idemKey
        - approvedBy
        - approvalReason
      properties:
        idemKey:
          type: string
        approvedBy:
          type: string
        approvalReason:
          type: string
    SuspendAgentRequest:
      type: object
      additionalProperties: false
      required:
        - reason
        - idemKey
      properties:
        reason:
          type: string
        idemKey:
          type: string
    RevokeAgentRequest:
      type: object
      additionalProperties: false
      required:
        - reason
        - idemKey
      properties:
        reason:
          type: string
        idemKey:
          type: string
    AgentTransitionResponse:
      type: object
      additionalProperties: false
      required:
        - dnaId
        - previousStatus
        - newStatus
      properties:
        dnaId:
          type: string
          format: uuid
        previousStatus:
          $ref: '#/components/schemas/AgentStatus'
        newStatus:
          $ref: '#/components/schemas/AgentStatus'
    VerifyAgentResponse:
      type: object
      additionalProperties: false
      required:
        - dnaId
        - agentName
        - publicKeyHex
        - status
        - capabilities
        - isAuthorized
      properties:
        dnaId:
          type: string
          format: uuid
        parentDnaId:
          type:
            - string
            - 'null'
          format: uuid
        agentName:
          type: string
        publicKeyHex:
          type: string
        status:
          $ref: '#/components/schemas/AgentStatus'
        capabilities:
          type: array
          items:
            type: string
        isAuthorized:
          type: boolean
        deniedReason:
          type:
            - string
            - 'null'
    AgentRecord:
      type: object
      additionalProperties: false
      required:
        - dnaId
        - agentName
        - publicKeyHex
        - ownerId
        - ownerName
        - jurisdiction
        - capabilities
        - status
        - createdAt
        - updatedAt
        - version
      properties:
        dnaId:
          type: string
          format: uuid
        parentDnaId:
          type:
            - string
            - 'null'
          format: uuid
        agentName:
          type: string
        publicKeyHex:
          type: string
        workloadIdentity:
          type:
            - string
            - 'null'
        provenanceRef:
          type:
            - string
            - 'null'
        ownerId:
          type: string
          format: uuid
        ownerName:
          type: string
        jurisdiction:
          type: string
        capabilities:
          type: array
          items:
            type: string
        status:
          $ref: '#/components/schemas/AgentStatus'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        approvedAt:
          type:
            - string
            - 'null'
          format: date-time
        approvedBy:
          type:
            - string
            - 'null'
        approvalReason:
          type:
            - string
            - 'null'
        revokedAt:
          type:
            - string
            - 'null'
          format: date-time
        revokedReason:
          type:
            - string
            - 'null'
        expiresAt:
          type:
            - string
            - 'null'
          format: date-time
        version:
          type: integer
          format: int32
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: string
    HealthStatus:
      type: object
      additionalProperties: true
      properties:
        status:
          type: string
        checks:
          type: array
          items:
            type: object
            additionalProperties: true
