services:

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB:       agentdna
      POSTGRES_USER:     agentdna
      POSTGRES_PASSWORD: agentdna
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentdna"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── DNA Registry (port 8081) ─────────────────────────────────────────────────
  dna-registry:
    build:
      context: services/dna-registry
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      QUARKUS_PROFILE:          prod
      JDBC_DATABASE_URL:        jdbc:postgresql://postgres:5432/agentdna?currentSchema=agent_dna
      JDBC_DATABASE_USERNAME:   agentdna
      JDBC_DATABASE_PASSWORD:   agentdna
      CORS_ALLOWED_ORIGINS:     "http://localhost:3002,http://dna-enforcer:8082"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/v1/agents || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── DNA Enforcer (port 8082) ─────────────────────────────────────────────────
  dna-enforcer:
    build:
      context: services/dna-enforcer
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
    environment:
      QUARKUS_PROFILE:      prod
      REGISTRY_URL:         http://dna-registry:8081
      CORS_ALLOWED_ORIGINS: http://localhost:3002
    depends_on:
      dna-registry:
        condition: service_healthy

  # ── DNA Portal (port 3002) ────────────────────────────────────────────────────
  dna-portal:
    build:
      context: web/dna-portal
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* vars are baked into the JS bundle at build time.
        # In production (Vercel), set these in the Vercel dashboard instead.
        NEXT_PUBLIC_REGISTRY_URL: http://localhost:8081
        NEXT_PUBLIC_ENFORCER_URL: http://localhost:8082
    ports:
      - "3002:3002"
    depends_on:
      - dna-enforcer
